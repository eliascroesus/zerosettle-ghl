name = "zerosettle-ghl-relay"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

# Keep request logs in the Cloudflare dashboard (Workers & Pages -> this worker -> Logs),
# so failures can be looked at after the fact, not only while `wrangler tail` is running.
[observability]
enabled = true

# Secrets (not stored in this file):
#   RELAY_SECRET       - value GoHighLevel must send in the "x-relay-secret" header
#   ZEROSETTLE_API_KEY - ZeroSettle API key

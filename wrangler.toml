name = "zerosettle-ghl-relay"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

# Keep request logs in the Cloudflare dashboard (Workers & Pages -> this worker -> Logs),
# so failures can be looked at after the fact, not only while `wrangler tail` is running.
[observability]
enabled = true

# Ricky's worker runs the waitlist too (src/queue.js); see the trading worker below.
# Hourly check: sends whoever fits, including the SEND_HOUR batch.
[triggers]
crons = ["0 * * * *"]

[vars]
# Ricky's ZeroSettle line, +1 (415) 595-8874. Without a line_id, ZeroSettle picks a line
# itself on accounts with several numbers, so leads could go out from another creator's line.
ZEROSETTLE_LINE_ID = "ln_5e26a0ae50f4ea21"
# Priority comes from the contact's tags: ricky-booked > ricky-applied > opted in > ricky-not-qualified.
CREATOR_TAG = "ricky"
TIMEZONE = "America/New_York"
HOLD_FROM_HOUR = "3"
SEND_HOUR = "12"
TAG_PREFIX = "ricky-imessage-"

[[durable_objects.bindings]]
name = "LEAD_QUEUE"
class_name = "LeadQueue"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LeadQueue"]

# Secrets (not stored in this file):
#   RELAY_SECRET       - value GoHighLevel must send in the "x-relay-secret" header
#   ZEROSETTLE_API_KEY - ZeroSettle API key

# Second creator (trading offer): a separate worker with its own URL, secrets and logs.
# Deploy with: npx wrangler deploy --env trading
# This worker also runs the waitlist (src/queue.js): ZeroSettle's Pro plan allows 5 new
# contacts a day per line (reset at 3 AM Eastern); leads past that wait their turn.
[env.trading]
name = "zerosettle-ghl-relay-trading"
# Hourly check: sends whoever fits, including the SEND_HOUR batch.
triggers = { crons = ["0 * * * *"] }

[env.trading.vars]
# Jean's ZeroSettle line, +1 (415) 802-3056.
ZEROSETTLE_LINE_ID = "ln_08cecb430b9c9ae9"
# Priority comes from the contact's tags: jean-booked > jean-applied > opted in > jean-not-qualified.
CREATOR_TAG = "jean"
TIMEZONE = "America/New_York"
# ZeroSettle's day starts at 3 AM; from then until noon, opt-ins wait for the noon batch.
HOLD_FROM_HOUR = "3"
SEND_HOUR = "12"
TAG_PREFIX = "jean-imessage-"

[[env.trading.durable_objects.bindings]]
name = "LEAD_QUEUE"
class_name = "LeadQueue"

[[env.trading.migrations]]
tag = "v1"
new_sqlite_classes = ["LeadQueue"]

[env.trading.observability]
enabled = true
